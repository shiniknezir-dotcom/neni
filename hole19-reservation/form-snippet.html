<!--
  Hole 19 — Reservierungsformular (Beispiel)

  Copy the WHOLE content of this file (the <form>, the <style> and the <script>)
  into your page and set the form's action to where reserve.php lives.
  The "Website" field is a spam trap: it must never be visible to guests, and any
  value in it makes the server discard the request silently (no e-mail is sent).
  The form also works without JavaScript (classic post with a German result page).
-->
<form class="h19-reservation" method="post" action="/reservierung/reserve.php">
  <h2>Tisch reservieren</h2>

  <label>
    Name*
    <input type="text" name="name" autocomplete="name" required minlength="2" maxlength="60">
  </label>

  <label>
    E-Mail*
    <input type="email" name="email" autocomplete="email" required maxlength="254">
  </label>

  <label>
    Telefon
    <input type="tel" name="phone" autocomplete="tel" maxlength="40">
  </label>

  <div class="h19-row">
    <label>
      Datum
      <input type="date" name="date">
    </label>
    <label>
      Uhrzeit
      <input type="time" name="time">
    </label>
    <label>
      Personen
      <input type="number" name="guests" min="1" max="99" inputmode="numeric">
    </label>
  </div>

  <label>
    Nachricht
    <textarea name="message" rows="3" maxlength="1000" placeholder="Anlass, Wünsche, Allergien …"></textarea>
  </label>

  <!-- Spam trap (honeypot). Stays hidden via inline style even if the <style> block is not copied.
       Field name must match 'honeypot_field' in config.php. -->
  <div class="h19-hp" aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden">
    <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>

  <button type="submit">Reservierung absenden</button>
  <p class="h19-status" role="status" aria-live="polite"></p>
</form>

<style>
  .h19-reservation { max-width: 560px; display: grid; gap: 14px; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1d241b; }
  .h19-reservation h2 { margin: 0 0 4px; font-size: 24px; color: #1f4d2e; }
  .h19-reservation label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  .h19-reservation input, .h19-reservation textarea { font: inherit; font-weight: 400; padding: 10px 12px; border: 1px solid #c8d0c4; border-radius: 8px; background: #fff; }
  .h19-reservation input:focus, .h19-reservation textarea:focus { outline: 2px solid #1f4d2e; outline-offset: 1px; }
  .h19-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
  .h19-hp { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  .h19-reservation button { font: inherit; font-weight: 700; padding: 12px 20px; border: 0; border-radius: 999px; background: #1f4d2e; color: #fff; cursor: pointer; }
  .h19-reservation button[disabled] { opacity: .6; cursor: progress; }
  .h19-status { margin: 0; min-height: 1.5em; font-size: 15px; }
  .h19-status.ok { color: #1f4d2e; font-weight: 600; }
  .h19-status.err { color: #a32d2d; }
</style>

<script>
  document.querySelectorAll('form.h19-reservation').forEach(function (form) {
    var status = form.querySelector('.h19-status');
    var button = form.querySelector('button[type="submit"]');
    // With JavaScript we show validation inline; without it the browser validates and posts normally.
    form.setAttribute('novalidate', '');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      status.textContent = '';
      status.className = 'h19-status';
      if (!form.reportValidity()) { return; }

      button.disabled = true;
      var data = {};
      new FormData(form).forEach(function (value, key) { data[key] = value; });

      fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (result.ok && result.body.ok) {
            form.reset();
            status.textContent = result.body.message || 'Vielen Dank! Die Reservierung wurde bestätigt.';
            status.className = 'h19-status ok';
          } else {
            var errors = result.body.errors ? Object.keys(result.body.errors).map(function (k) { return result.body.errors[k]; }).join(' ') : '';
            status.textContent = errors || result.body.error || 'Das hat leider nicht geklappt. Bitte später noch einmal versuchen.';
            status.className = 'h19-status err';
          }
        })
        .catch(function () {
          status.textContent = 'Keine Verbindung. Bitte später noch einmal versuchen oder einfach anrufen.';
          status.className = 'h19-status err';
        })
        .finally(function () { button.disabled = false; });
    });
  });
</script>
